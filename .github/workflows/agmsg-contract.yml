name: agmsg-contract

# Tier 2 tests real upstream code at an immutable commit. The schedule can
# propose a pin bump only after success; relevant PRs recheck their pinned SHA.
on:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      agmsg_ref:
        description: 'Stable agmsg tag or full commit SHA (default: pinned SHA; never creates a PR)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.verified.outputs.run }}
      agmsg_ref: ${{ steps.decide.outputs.agmsg_ref }}
      agmsg_tag: ${{ steps.decide.outputs.agmsg_tag }}
      cache_key: ${{ steps.decide.outputs.cache_key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the contract commit
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          DISPATCH_REF: ${{ inputs.agmsg_ref }}
        run: python3 -B scripts/agmsg_contract.py scope
      - name: Look up the verified tag and commit
        id: cache
        if: steps.decide.outputs.cache_key != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .agmsg-contract-passed
          key: ${{ steps.decide.outputs.cache_key }}
          lookup-only: true
      - name: Decide whether to repeat the contract
        id: verified
        env:
          DECIDED: ${{ steps.decide.outputs.run }}
          PASSED: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$PASSED" = true ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'This tag and SHA already passed; the PR proposal can still be retried.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=$DECIDED" >> "$GITHUB_OUTPUT"
          fi

  # Always reports a conclusion, even when no contract-relevant files changed.
  # Keep this job suitable for branch protection: agmsg-contract / contract.
  contract:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to verify
        if: needs.scope.outputs.run != 'true'
        run: echo 'No new contract verification needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.scope.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: needs.scope.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: Install sqlite3
        if: needs.scope.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sqlite3
      - name: Install the resolved agmsg commit in an isolated HOME
        if: needs.scope.outputs.run == 'true'
        env:
          AGMSG_SHA: ${{ needs.scope.outputs.agmsg_ref }}
        run: |
          set -euo pipefail
          [[ "$AGMSG_SHA" =~ ^[0-9a-f]{40}$ ]]
          git clone --quiet https://github.com/fujibee/agmsg.git "$RUNNER_TEMP/agmsg-src"
          git -C "$RUNNER_TEMP/agmsg-src" checkout --quiet --detach "$AGMSG_SHA"
          test "$(git -C "$RUNNER_TEMP/agmsg-src" rev-parse HEAD)" = "$AGMSG_SHA"
          mkdir -p "$RUNNER_TEMP/agmsg-home"
          (
            unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME
            unset CLAUDE_CONFIG_DIR CODEX_HOME AGMSG_STORAGE_PATH
            export HOME="$RUNNER_TEMP/agmsg-home" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
            cd "$RUNNER_TEMP/agmsg-src"
            ./install.sh --cmd agmsg
          )
      - name: Run the contract
        if: needs.scope.outputs.run == 'true'
        run: make test-agmsg-contract AGMSG_PATH="$RUNNER_TEMP/agmsg-home/.agents/skills/agmsg"
      - name: Remember successful verification
        if: needs.scope.outputs.run == 'true' && needs.scope.outputs.cache_key != ''
        run: date -u +%FT%TZ > .agmsg-contract-passed
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.scope.outputs.run == 'true' && needs.scope.outputs.cache_key != ''
        with:
          path: .agmsg-contract-passed
          key: ${{ needs.scope.outputs.cache_key }}

  propose-bump:
    needs: [scope, contract]
    # PRs and manual dispatches never receive the App token. A cached success
    # may retry proposal after missing credentials or a transient GitHub error.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check optional App configuration
        id: app
        env:
          APP_ID: ${{ secrets.AGMSG_BUMP_APP_ID }}
          APP_KEY: ${{ secrets.AGMSG_BUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'GitHub App secrets are absent; contract passed, no bump PR created.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: steps.app.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: steps.app.outputs.enabled == 'true'
        with:
          go-version-file: go.mod
      - name: Recapture fixtures and update the pin
        if: steps.app.outputs.enabled == 'true'
        env:
          AGMSG_TAG: ${{ needs.scope.outputs.agmsg_tag }}
          AGMSG_SHA: ${{ needs.scope.outputs.agmsg_ref }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sqlite3
          git clone --quiet https://github.com/fujibee/agmsg.git "$RUNNER_TEMP/agmsg-src"
          git -C "$RUNNER_TEMP/agmsg-src" checkout --quiet --detach "$AGMSG_SHA"
          export AGMSG_SOURCE="$RUNNER_TEMP/agmsg-src"
          python3 -B scripts/agmsg_contract.py prepare
          go test ./internal/agmsg -run '^TestAgmsgFixture_' -count=1
      # Mint only after upstream installer/capture finished. No token is given
      # to upstream code. Git/gh below use this repository-scoped short-lived token.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        if: steps.app.outputs.enabled == 'true'
        id: token
        with:
          app-id: ${{ secrets.AGMSG_BUMP_APP_ID }}
          private-key: ${{ secrets.AGMSG_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create the release-specific PR once
        if: steps.app.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          AGMSG_TAG: ${{ needs.scope.outputs.agmsg_tag }}
          AGMSG_SHA: ${{ needs.scope.outputs.agmsg_ref }}
        run: |
          set -euo pipefail
          gh auth setup-git
          python3 -B scripts/agmsg_contract.py pr
