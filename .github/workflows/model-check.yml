name: model-check

on:
  push:
    branches:
      - main
    paths:
      - 'docs/models/**'
      - 'spec/**'
      - 'scripts/model_check.sh'
      - 'scripts/tla_transitions.py'
      - 'internal/board/testdata/*-transitions.json'
      - '.github/workflows/model-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/models/**'
      - 'spec/**'
      - 'scripts/model_check.sh'
      - 'scripts/tla_transitions.py'
      - 'internal/board/testdata/*-transitions.json'
      - '.github/workflows/model-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alloy:
    runs-on: ubuntu-latest
    env:
      ALLOY_JAR_SHA256: 6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download Alloy
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy
          curl -fsSL \
            -o /tmp/alloy/org.alloytools.alloy.dist.jar \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
          echo "${ALLOY_JAR_SHA256}  /tmp/alloy/org.alloytools.alloy.dist.jar" | shasum -a 256 -c -

      - name: Validate Alloy models
        run: |
          set -euo pipefail
          shopt -s nullglob
          models=(docs/models/*.als)
          if [ "${#models[@]}" -eq 0 ]; then
            echo "No Alloy models found under docs/models"
            exit 1
          fi

          for model in "${models[@]}"; do
            echo "::group::${model}"
            java -jar /tmp/alloy/org.alloytools.alloy.dist.jar commands "$model"
            out_dir="$(mktemp -d)"
            log_file="$(mktemp)"
            receipt_file="$out_dir/receipt.json"
            java -jar /tmp/alloy/org.alloytools.alloy.dist.jar exec -t none -o "$out_dir" -f "$model" 2>&1 | tee "$log_file"
            python3 - "$model" "$log_file" "$receipt_file" <<'PY'
          import re
          import json
          import sys
          from pathlib import Path

          model = sys.argv[1]
          log_path = Path(sys.argv[2])
          receipt_path = Path(sys.argv[3])
          receipt = json.loads(receipt_path.read_text())
          expected_checks = sum(
              1 for command in receipt.get("commands", {}).values()
              if command.get("type") == "check"
          )
          if expected_checks == 0:
              raise SystemExit(f"{model}: no Alloy check commands found in receipt")

          ansi_pattern = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          control_pattern = re.compile(r"[\x00-\x08\x0b-\x1f\x7f]")
          verdict_pattern = re.compile(r"\b(UNSAT|SAT|UNKNOWN)\b")

          unsat_lines = []
          bad_lines = []
          for raw_line in log_path.read_text().splitlines():
              normalized = control_pattern.sub("", ansi_pattern.sub("", raw_line))
              verdict = verdict_pattern.search(normalized)
              if verdict is None:
                  continue
              if verdict.group(1) == "UNSAT":
                  unsat_lines.append(normalized)
              else:
                  bad_lines.append(normalized)

          if bad_lines:
              joined = "\n".join(bad_lines)
              raise SystemExit(f"{model}: expected all checks to be UNSAT, got:\n{joined}")

          if len(unsat_lines) != expected_checks:
              joined = "\n".join(unsat_lines)
              raise SystemExit(
                  f"{model}: expected {expected_checks} UNSAT results, got {len(unsat_lines)}\n{joined}"
              )
          PY
            echo "::endgroup::"
          done

  # Tier 2 of issue #168's model-checking split. Runs TLC over the TLA+ specs
  # in spec/agentboard/, then regenerates each one's transition table and
  # diffs it against the copy committed under internal/board/testdata/.
  #
  # Tier 1 -- internal/board/ledger_conformance_test.go, inside `make check`
  # -- replays the real Go implementation against that committed table on
  # every commit, with no JDK and no jar. This job is what keeps the table
  # honest about the spec, and it is separate for the reason the agmsg
  # contract job is: it needs an external toolchain, and `make check` stays
  # hermetic.
  tlc:
    runs-on: ubuntu-latest
    env:
      # Pinned and checksummed for the same reason the Alloy jar above is: a
      # model checker that silently changed version is a model check nobody
      # can reproduce.
      TLA_TOOLS_VERSION: v1.7.4
      TLA_TOOLS_JAR_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p /tmp/tla
          curl -fsSL \
            -o /tmp/tla/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA_TOOLS_JAR_SHA256}  /tmp/tla/tla2tools.jar" | shasum -a 256 -c -

      - name: Model-check the specs and diff the exported transition tables
        run: TLA_TOOLS_JAR=/tmp/tla/tla2tools.jar make model-check
