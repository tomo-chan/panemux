# panemux configuration reference
# All fields are documented below. Copy this file, adjust values, and run:
#   panemux --config config.yaml

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080          # 1–65535  (default: 8080)
  host: "127.0.0.1"  # bind address (default: 127.0.0.1)
  # Bearer token for the Agent Board API and the command center. Leave empty
  # and panemux generates one on first run, storing it in
  # ~/.config/panemux/token rather than writing it back here. Required (and
  # validated at startup) when `host` is not a loopback address.
  auth_token: ""

# ── Agent Board ───────────────────────────────────────────────────────────────
# One dashboard for what every pane's coding agent is doing, plus a command
# palette to message them. Optional: omit this whole block and panemux behaves
# exactly as it did without it. See the README's "Agent Board" section for the
# setup steps, and note that agmsg must already be installed on every host
# whose panes join — panemux never installs it.
agent_board:
  team: "panemux"                      # shared agmsg team for all board-enabled panes
  agmsg_path: "~/.agents/skills/agmsg"  # ~/ is expanded per host, remote hosts included

# ── Command center ────────────────────────────────────────────────────────────
# Cmd/Ctrl+Shift+K opens a palette that asks a headless `claude` about the
# board and can message panes. Needs the `claude` CLI on this machine and a
# server.auth_token (generated above if left empty). Does not need agmsg.
command_center:
  enabled: false  # default: false

# ── Display ───────────────────────────────────────────────────────────────────
# Global defaults for all panes. Individual panes can override these values.
display:
  show_header: true      # show pane header with title and controls (default: true)
  show_status_bar: true  # show terminal dimensions bar at the bottom (default: true)

# ── Opening URLs from a pane ──────────────────────────────────────────────────
# When a URL is opened from a pane, panemux republishes the URL's loopback
# callback port (from `redirect_uri` and friends) at the same port on this host,
# so a CLI login flow running on an SSH host completes its OAuth callback.
#
# `browser_shim` additionally intercepts programs that open a browser directly
# (`$BROWSER`, `xdg-open`, `open`) on `local` and `ssh` panes, by installing a
# small shell shim under the pane host's `~/.cache/panemux/bin`. The pane then
# asks before anything is opened. Set it to false to install nothing and leave
# `ssh` panes' shell startup exactly as it was.
url_open:
  browser_shim: true  # default: true

# ── SSH connections ────────────────────────────────────────────────────────────
# Define named SSH connections here; reference them in panes with `connection:`.
ssh_connections:

  # Key-based authentication (recommended)
  prod-web:
    host: "192.168.1.10"
    port: 22
    user: "deploy"
    key_file: "~/.ssh/id_ed25519"  # ~/  is expanded to $HOME

  # Key-based auth with an explicit known_hosts file
  bastion:
    host: "bastion.example.com"
    port: 22
    user: "ops"
    key_file: "~/.ssh/id_ed25519"
    known_hosts_file: "~/.ssh/known_hosts"  # omit to accept any host key (insecure)

  # Password authentication
  staging:
    host: "10.0.0.5"
    port: 22
    user: "ubuntu"
    password: "secret"

# ── Workspaces ────────────────────────────────────────────────────────────────
# Workspaces are tabbed layouts. Each workspace owns one recursive tree of
# splits and panes. `tab_position` controls where the workspace tabs are shown:
# top | bottom | left | right.
#
# Older config files with a top-level `layout:` are still accepted. On the next
# save, panemux migrates them to a single `default` workspace and writes only the
# `workspaces:` format.
#
# The workspace bar remains available for workspace actions even when only one
# workspace exists. Use it to add terminals, add workspaces, rename/delete
# workspaces, or move workspace tabs. New workspaces start with one local
# terminal pane. Deleting a workspace asks for confirmation, and the last
# remaining workspace cannot be deleted. The active workspace selection and
# tab_position are saved. `vertical_bar_width` controls the shared width in
# pixels when the workspace bar is on the left or right.
#
# Split node  — has `direction` and `children` (no `pane`)
# Leaf node   — has `pane` (no `direction` / `children`)
#
# `size` values of sibling children must sum to 100 (percentages).
# Directions: horizontal (side-by-side) | vertical (stacked)
#
# Pane types: local | ssh | tmux | ssh_tmux
#
# ┌─────────────────────┬──────────────────────────────────────────────┐
# │                     │  ssh                                         │
# │  local              ├──────────────────────┬───────────────────────┤
# │                     │  tmux                │  ssh_tmux             │
# └─────────────────────┴──────────────────────┴───────────────────────┘

workspaces:
  active: dev
  tab_position: top
  vertical_bar_width: 280
  items:
    - id: dev
      title: "Development"
      layout:
        direction: horizontal
        children:

          # ── local pane ────────────────────────────────────────────────────
          # Spawns a local shell process via PTY.
          - size: 50
            pane:
              id: "local-main"
              type: local
              shell: "/bin/zsh"       # optional; must be an absolute path
              cwd: "~/development"    # optional; ~/ is expanded
              title: "Dev Shell"      # optional; shown in the pane header
              # Per-pane display overrides (uncomment to override global display settings):
              # show_header: false
              show_status_bar: false  # hide dimensions bar for this pane only

          # ── right half: vertical split ────────────────────────────────────
          - size: 50
            direction: vertical
            children:

              # ── ssh pane ─────────────────────────────────────────────────
              # Opens a remote shell via SSH. `connection` must match a key under
              # ssh_connections above.
              - size: 40
                pane:
                  id: "ssh-prod"
                  type: ssh
                  connection: prod-web  # references ssh_connections key
                  cwd: "/var/www"       # optional; remote working directory
                  title: "Prod Web"

              # ── bottom half: horizontal split ────────────────────────────
              - size: 60
                direction: horizontal
                children:

                  # ── tmux pane ────────────────────────────────────────────
                  # Attaches to a local tmux session (creates it if it doesn't exist).
                  - size: 50
                    pane:
                      id: "tmux-local"
                      type: tmux
                      tmux_session: "work"  # tmux session name; created if absent
                      title: "Tmux Work"

                  # ── ssh_tmux pane ────────────────────────────────────────
                  # SSHs to a remote host, then attaches to a tmux session there
                  # (creates the session if it doesn't exist).
                  - size: 50
                    pane:
                      id: "ssh-tmux-bastion"
                      type: ssh_tmux
                      connection: bastion       # references ssh_connections key
                      tmux_session: "monitor"   # remote tmux session name
                      title: "Bastion Monitor"
                      show_header: false        # hide header for this pane only

    - id: ops
      title: "Operations"
      layout:
        direction: horizontal
        children:
          - size: 100
            pane:
              id: "ops-shell"
              type: local
              shell: "/bin/zsh"
              title: "Ops Shell"
              # ── Agent Board opt-in (per pane) ───────────────────────────
              # The pane id doubles as this pane's board address, so prefer a
              # name you will recognise. Also settable from Pane Settings in
              # the UI, without editing this file.
              agent_board:
                enabled: true
                # monitor (default) — status only; messages are NOT delivered
                # turn / both      — messages delivered, but agmsg writes a
                #                    hook file into the pane's project
                #                    directory (see the README)
                # off              — no automatic delivery
                mode: monitor
