# Fixture for the documentation screenshots (screenshots.spec.ts, port 4180).
#
# Every path and name here is a placeholder: run-panemux-screenshots.sh
# creates /tmp/sample-project as a link to a throwaway git repository and
# gives the server a fake HOME, so nothing from the machine generating the images ends
# up in them (DEVELOPMENT.md's path-sanitization rule).
server:
    host: 127.0.0.1
    port: 4180
agent_board:
    enabled: true
    mode: monitor
    agmsg_auto_update: false
    team: panemux-screenshots
    # The runner places the stub under the fixed path in its fake HOME.
workspaces:
    active: dev
    tab_position: left
    items:
        - id: dev
          title: Development
          layout:
            direction: horizontal
            children:
                - pane:
                    id: editor
                    type: local
                    shell: /bin/bash
                    cwd: /tmp/sample-project
                    title: Project
                  size: 50
                - direction: vertical
                  children:
                    - pane:
                        id: server
                        type: tmux
                        tmux_session: sample-server
                        title: Dev server
                      size: 50
                    - pane:
                        id: tests
                        type: local
                        shell: /bin/bash
                        cwd: /tmp/sample-project
                        title: Tests
                      size: 50
                  size: 50
        - id: review
          title: Review
          layout:
            direction: horizontal
            children:
                - pane:
                    id: review-main
                    type: local
                    shell: /bin/bash
                    cwd: /tmp/sample-project
                    title: Review
                  size: 100
        - id: ops
          title: Ops
          layout:
            direction: horizontal
            children:
                - pane:
                    id: ops-main
                    type: local
                    shell: /bin/bash
                    cwd: /tmp/sample-project
                    title: Ops
                  size: 100
url_open:
    browser_shim: false
display:
    show_header: true
    show_status_bar: true
