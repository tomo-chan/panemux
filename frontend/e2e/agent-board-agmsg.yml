server:
    host: 127.0.0.1
    port: 4175
agent_board:
    enabled: true
    mode: monitor
    agmsg_auto_update: false
    team: panemux-e2e
    # The runner creates a stub under its fake HOME/.agents/skills/agmsg.
workspaces:
    active: default
    tab_position: top
    items:
        - id: default
          title: Default
          layout:
            direction: horizontal
            children:
                - pane:
                    id: board-main
                    type: local
                    shell: /bin/bash
                    cwd: /tmp
                    title: Board Main
                  size: 50
                - pane:
                    id: board-worker
                    type: local
                    shell: /bin/bash
                    cwd: /tmp
                    title: Board Worker
                  size: 50
display:
    show_header: true
    show_status_bar: true
