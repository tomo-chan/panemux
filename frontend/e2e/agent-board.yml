server:
    host: 127.0.0.1
    port: 4174
agent_board:
    enabled: true
    mode: monitor
    agmsg_auto_update: false
    team: panemux-e2e-empty
    # The isolated HOME has no agmsg installation: this fixture
    # is the "agent board is enabled but the operator has not installed
    # agmsg" state, which is what the dashboard's empty states are for.
workspaces:
    active: default
    tab_position: top
    items:
        - id: default
          title: Default
          layout:
            direction: horizontal
            children:
                - pane:
                    id: board-main
                    type: local
                    shell: /bin/bash
                    cwd: /tmp
                    title: Board Main
                  size: 100
display:
    show_header: true
    show_status_bar: true
